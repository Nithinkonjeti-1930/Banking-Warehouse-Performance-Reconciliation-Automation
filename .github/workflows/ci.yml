name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: python src/reconcile.py --source data/source_transactions.csv --target data/warehouse_transactions.csv
      - run: python src/build_demo_warehouse.py
